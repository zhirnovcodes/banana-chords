<svg width="298" height="169" viewBox="0 0 298 169" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Steps 1-3. Geometry = Figma Frame 4 (device origin 99,92 subtracted). -->
  <defs>
    <!-- Ivan's cardboard photo, shrunk so the grain is small -->
    <pattern id="cardboard" patternUnits="userSpaceOnUse" width="843" height="547" patternTransform="scale(0.3)">
      <image href="../assets/cardboard.png" width="843" height="547"/>
    </pattern>

    <!-- LCD detail: fine pixel grid (screen references: Nokia / BlackBerry LCD) -->
    <pattern id="lcd" patternUnits="userSpaceOnUse" width="1.5" height="1.5">
      <rect width="1.5" height="0.3" fill="#1d3c3a"/>
      <rect width="0.3" height="1.5" fill="#1d3c3a"/>
    </pattern>

    <!-- Frame shadow falling onto the screen: inner shadow from the top edge (BlackBerry reference) -->
    <filter id="frame-shadow" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#2b2418" flood-opacity="0.6"/>
      <feComposite in2="SourceAlpha" operator="out"/>
      <feOffset dx="1" dy="3.5"/>
      <feGaussianBlur stdDeviation="1.8"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>

    <!-- Silicone pad (pad reference): thick slab, rounded corners, matte, edges glow lighter -->
    <filter id="btn-drop" x="-10%" y="-40%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="btn-contact" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <linearGradient id="btn-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7AEAB"/>
      <stop offset="0.85" stop-color="#E3A9A6"/>
      <stop offset="1" stop-color="#D9A09D"/>
    </linearGradient>
    <linearGradient id="btn-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C99795"/>
      <stop offset="1" stop-color="#B8827F"/>
    </linearGradient>
    <filter id="btn-silicone" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <!-- rounded edge: the rim of the face is lighter (light through the silicone), no white -->
      <feFlood flood-color="#F2C6C3" flood-opacity="1"/>
      <feComposite in2="SourceAlpha" operator="out"/>
      <feOffset dy="0.6"/>
      <feGaussianBlur stdDeviation="1.8"/>
      <feComposite in2="SourceAlpha" operator="in" result="rim"/>
      <!-- matte silicone grain -->
      <feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" result="grain"
        values="0 0 0 0 0.45  0 0 0 0 0.25  0 0 0 0 0.25  0 0 0 -0.25 0.14"/>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="grainIn"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="rim"/><feMergeNode in="grainIn"/></feMerge>
    </filter>
    <filter id="btn-side-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="2" seed="6" result="n"/>
      <feColorMatrix in="n" type="matrix" result="grain"
        values="0 0 0 0 0.3  0 0 0 0 0.15  0 0 0 0 0.15  0 0 0 -0.25 0.14"/>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="g"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="g"/></feMerge>
    </filter>
    <!-- Hand-drawn SHUFFLE: same crop as Figma (pattern1_13_937) -->
    <pattern id="shuffle" patternContentUnits="objectBoundingBox" width="1" height="1">
      <image href="../assets/label-shuffle.png" width="420" height="123" preserveAspectRatio="none"
        transform="matrix(0.00240891 0 0 0.00813008 -0.00587173 0)"/>
    </pattern>

    <!-- Hand-drawn title: same crop as Figma (pattern0_13_937) -->
    <pattern id="title" patternContentUnits="objectBoundingBox" width="1" height="1">
      <image href="../assets/title-banana-chords.png" width="765" height="91" preserveAspectRatio="none"
        transform="matrix(0.00261438 0 0 0.0222222 -0.0686274 -0.761111)"/>
    </pattern>
  </defs>

  <!-- Frame: #D8BC8E with the cardboard photo blended on top -->
  <g id="frame" style="isolation:isolate">
    <rect id="body" width="298" height="169" fill="#D8BC8E"/>
    <rect id="body-texture" width="298" height="169" fill="url(#cardboard)" style="mix-blend-mode:soft-light"/>
  </g>

  <!-- Screens: flat LCD, frame shadow on top, no stroke -->
  <g id="screen-main">
    <rect x="11" y="13" width="277" height="97" rx="9" fill="#86C2BE"/>
    <rect x="11" y="13" width="277" height="97" rx="9" fill="url(#lcd)" opacity="0.10"/>
    <rect x="11" y="13" width="277" height="97" rx="9" fill="#000" filter="url(#frame-shadow)"/>
  </g>
  <g id="screen-bottom">
    <rect x="141" y="117" width="147" height="44" rx="4" fill="#86C2BE"/>
    <rect x="141" y="117" width="147" height="44" rx="4" fill="url(#lcd)" opacity="0.10"/>
    <rect x="141" y="117" width="147" height="44" rx="4" fill="#000" filter="url(#frame-shadow)"/>
  </g>

  <!-- Main text (hand-drawn image) -->
  <rect id="title" x="21" y="118" width="102" height="12" fill="url(#title)"/>

  <!-- Button: prototype face 107x20 at 17,136; side #C99795 shows as the pad's thickness below -->
  <g id="button-shuffle">
    <rect id="btn-shadow" x="18" y="142" width="108" height="19" rx="4" fill="#3d2a18" opacity="0.45" filter="url(#btn-drop)"/>
    <rect id="btn-contact" x="17.5" y="140" width="106" height="19.6" rx="3" fill="#3d2a18" opacity="0.6" filter="url(#btn-contact)"/>
    <rect id="btn-side" x="17" y="139" width="107" height="20" rx="3" fill="url(#btn-side)" filter="url(#btn-side-grain)"/>
    <rect id="btn-face" x="17" y="136" width="107" height="20" rx="3" fill="url(#btn-face)" filter="url(#btn-silicone)"/>
    <rect id="btn-label" x="44" y="138.5" width="54" height="16" fill="url(#shuffle)"/>
  </g>
</svg>
