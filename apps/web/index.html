<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banana Chords · dev</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f0e0a;
        --panel: #1b1912;
        --line: #353020;
        --text: #f3eedc;
        --muted: #9d977f;
        --accent: #f5d23c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
      h1 { font-size: 18px; margin: 0; letter-spacing: 0.04em; }
      h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
      .bar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
      }
      .bar label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
      button {
        font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--line); background: #2a2619; color: var(--text);
      }
      button.primary { background: var(--accent); color: #1d1a0c; border-color: var(--accent); }
      button:disabled { opacity: 0.4; cursor: default; }
      input[type='number'] { width: 70px; font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
      input[type='range'] { accent-color: var(--accent); }
      .stats { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
      .layout { display: grid; grid-template-columns: 560px 1fr; gap: 16px; align-items: start; }
      @media (max-width: 920px) { .layout { grid-template-columns: 1fr; } }
      #plugin { min-height: 470px; }
      #plugin:empty::before { content: 'Press Start audio to load the plugin.'; color: var(--muted); }
      .log {
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        padding: 8px 10px; height: 470px; overflow: auto;
        font: 12px/1.5 ui-monospace, 'Cascadia Mono', Consolas, monospace; color: var(--muted);
      }
      .log .on { color: var(--accent); }
      .log .off { color: var(--muted); }
      .log .sys { color: var(--text); }
      .hint { color: var(--muted); font-size: 12px; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Banana Chords <span>dev page · sine test synth</span></h1>
      <div class="bar">
        <button id="start" class="primary">Start audio</button>
        <button id="play" disabled>Play</button>
        <button id="stop" disabled>Stop</button>
        <label>BPM <input id="bpm" type="number" min="20" max="300" value="120" /></label>
        <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.6" /></label>
        <label><input id="click" type="checkbox" /> Click</label>
        <button id="save" disabled title="getState, then setState with it">State round-trip</button>
        <span class="stats" id="stats"></span>
      </div>
      <div class="layout">
        <div id="plugin"></div>
        <div class="log" id="log"></div>
      </div>
      <p class="hint">Space plays and stops. The log shows every note the plugin emits, in AudioContext seconds.</p>
    </main>
    <script type="module" src="/src/dev.ts"></script>
  </body>
</html>
